services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]   # persist the queue across restarts
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  api:
    build: .
    ports: ["8000:8000"]
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis: { condition: service_healthy }

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      REDIS_URL: redis://redis:6379/0
      INFERENCE_DELAY_SECONDS: "1"   # pretend the model is slow so the queue is visible
      JOB_LEASE_SECONDS: "30"
    stop_grace_period: 30s           # SIGTERM lets a worker finish its current job
    deploy:
      replicas: 3                    # scale: docker compose up --scale worker=5
    depends_on:
      redis: { condition: service_healthy }

volumes:
  redis-data:
